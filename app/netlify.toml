# La app se despliega como un sitio aparte del generador de propuestas.
# En Netlify: Base directory = app
[build]
  command = "npm run build"
  publish = "dist"

# La app es de una sola página: cualquier ruta la resuelve React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
