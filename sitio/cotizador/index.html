<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotizador de honorarios — Coproactiva</title>
<link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:#dedad4}
a{color:#d5863b}a:hover{color:#4a5a68}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{opacity:.3}
input:focus{border-color:#d5863b!important}
button:hover{opacity:.88}
.shell{grid-template-columns:minmax(400px,470px) 1fr}
@media (max-width:1180px){.shell{grid-template-columns:1fr}.panel{max-height:none!important;overflow:visible!important;border-right:none!important;border-top:3px solid #2b3138}.mainpane{order:-1;max-height:none!important;overflow:visible!important;padding:26px 18px 34px!important}}
@media print{.no-print{display:none!important}body{background:#fff}#root>div{display:block!important;max-height:none!important}main{padding:0!important;max-height:none!important;overflow:visible!important}#propuesta{box-shadow:none;padding:0;max-width:none}}
</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="cotizador-core.jsx"></script>
<script type="text/babel" src="cotizador-app.jsx"></script>
</body></html>
